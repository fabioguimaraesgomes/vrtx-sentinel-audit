name: ci-security

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/modular

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest semgrep pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          if [ $code -eq 5 ]; then
            echo "No tests collected; continuing for now."
            exit 0
          fi
          exit $code

      - name: SAST (Semgrep)
        run: semgrep scan --config auto --error --metrics=off .

      - name: Dependency audit (pip-audit JSON)
        run: |
          pip-audit -r requirements.txt --format json > pip-audit.json
          python .github/workflows/scripts/check_pip_audit_critical.py pip-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
