name: security-semgrep

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["security/**", "feature/**"]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep OWASP rules
        run: |
          mkdir -p release/security-reports
          semgrep --config=p/owasp src --json --output release/security-reports/semgrep-ci.json || true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: release/security-reports/semgrep-ci.json
