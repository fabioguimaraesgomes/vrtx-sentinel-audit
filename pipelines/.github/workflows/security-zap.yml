name: security-zap

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Staging URL to scan"
        required: false
        default: ""

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: target
        run: |
          INPUT_URL="${{ github.event.inputs.target_url }}"
          SECRET_URL="${{ secrets.STAGING_URL }}"
          TARGET_URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$TARGET_URL" ]; then
            echo "No target URL provided" >&2
            exit 1
          fi
          echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"

      - name: Run ZAP baseline
        run: |
          mkdir -p release/security-reports
          docker run --rm -t \
            -v "$PWD/release/security-reports:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ steps.target.outputs.target_url }}" -J zap_report.json -r zap_report.html

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            release/security-reports/zap_report.json
            release/security-reports/zap_report.html
